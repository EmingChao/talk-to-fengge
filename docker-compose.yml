name: talk-to-fengge

services:
  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.9.0}
    restart: unless-stopped
    command:
      - --config
      - /etc/livekit.yaml
      - --node-ip
      - ${LIVEKIT_NODE_IP:?请填写服务器公网 IP}
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?请填写 LiveKit API Key}: ${LIVEKIT_API_SECRET:?请填写 LiveKit API Secret}"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_HTTP_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      - "${LIVEKIT_RTC_PORT_START:-50000}-${LIVEKIT_RTC_PORT_END:-50100}:50000-50100/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7880/ | grep -q OK"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: talk-to-fengge-app:local
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      LIVEKIT_URL: ws://livekit:7880
      AGENT_NAME: talk-to-me-mimo
      LLM_PROVIDER: mimo
      TTS_PROVIDER: mimo
    command: ["python", "-m", "worker.main", "start"]
    depends_on:
      livekit:
        condition: service_healthy

  web:
    image: talk-to-fengge-app:local
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      LIVEKIT_URL: ws://livekit:7880
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8766
      AGENT_NAME: talk-to-me-mimo
    command: ["python", "-m", "worker.web_server"]
    ports:
      - "${WEB_PORT:-8766}:8766"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      livekit:
        condition: service_healthy
