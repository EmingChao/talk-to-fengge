<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talk to Me V3.6 — 峰哥</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%;
        background: #000;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
        user-select: none;
        -webkit-user-select: none;
    }

    #scene {
        position: fixed;
        inset: 0;
        display: block;
    }

    /* ---------- UI overlay ---------- */
    #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        color: #fff;
        z-index: 10;
    }

    /* ---------- Top bar ---------- */
    #topBar {
        position: fixed;
        top: 0; left: 0; right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 28px;
    }
    #modelLabel {
        color: #f2f2f4;
        font-size: 15px;
        font-weight: 600;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.9);
    }

    #statusPill {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(20, 20, 24, 0.55);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        padding: 9px 18px;
        font-size: 14px;
        color: #d8d8e0;
        letter-spacing: 0.02em;
        transition: border-color 0.4s;
    }
    #statusDot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: #666;
        flex: none;
        transition: background 0.4s, box-shadow 0.4s;
    }
    #statusDot.ready      { background: #8e8e93; }
    #statusDot.connecting { background: #ff9f0a; animation: dotBlink 1s ease-in-out infinite; }
    #statusDot.connected  { background: #34c759; box-shadow: 0 0 8px rgba(52, 199, 89, 0.8); }
    #statusDot.error      { background: #ff453a; }
    @keyframes dotBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* ---------- Toast ---------- */
    #toast {
        position: fixed;
        top: 76px;
        left: 50%;
        transform: translate(-50%, -8px);
        background: rgba(28, 28, 32, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        padding: 10px 22px;
        font-size: 14px;
        color: #ffd699;
        opacity: 0;
        transition: opacity 0.35s ease, transform 0.35s ease;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- 对话记录 ---------- */
    #conversation {
        position: fixed;
        left: 50%;
        bottom: 190px;
        width: min(720px, calc(100vw - 40px));
        max-height: min(46vh, 460px);
        transform: translateX(-50%);
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
        pointer-events: auto;
        padding: 8px 4px;
    }
    #messageList {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 24px;
    }
    .message {
        width: fit-content;
        max-width: min(82%, 560px);
        padding: 10px 13px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        color: #f7f7f8;
        font-size: 15px;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        user-select: text;
        -webkit-user-select: text;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
    }
    .message.user {
        align-self: flex-end;
        background: rgba(27, 96, 70, 0.78);
        border-color: rgba(100, 215, 164, 0.28);
    }
    .message.assistant {
        align-self: flex-start;
        background: rgba(30, 30, 36, 0.78);
    }
    .message.system {
        align-self: center;
        max-width: 100%;
        padding: 6px 10px;
        color: #ffd699;
        background: rgba(50, 38, 20, 0.72);
        font-size: 13px;
        text-align: center;
    }

    /* ---------- 底部控制区 ---------- */
    #bottomControls {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 0 20px max(20px, env(safe-area-inset-bottom));
        gap: 10px;
    }
    #composer {
        pointer-events: auto;
        width: min(720px, calc(100vw - 40px));
        min-height: 52px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 44px;
        align-items: end;
        gap: 8px;
        padding: 6px;
        background: rgba(20, 20, 24, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }
    #messageInput {
        width: 100%;
        min-height: 40px;
        max-height: 112px;
        resize: none;
        border: 0;
        outline: 0;
        background: transparent;
        color: #fff;
        padding: 10px 9px;
        font: inherit;
        font-size: 15px;
        line-height: 20px;
        user-select: text;
        -webkit-user-select: text;
    }
    #messageInput::placeholder { color: rgba(255, 255, 255, 0.42); }
    #messageInput:disabled { cursor: not-allowed; opacity: 0.55; }
    #sendButton, #micButton, #muteButton {
        pointer-events: auto;
        width: 44px; height: 44px;
        border-radius: 8px;
        border: 1px solid #444;
        background: rgba(14, 14, 18, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        outline: none;
        transition: border-color 0.4s ease, box-shadow 0.5s ease, transform 0.3s ease, background 0.4s ease;
    }
    #sendButton svg, #micButton svg, #muteButton svg {
        width: 21px; height: 21px;
        stroke: #cfcfd6;
        transition: stroke 0.4s ease;
    }
    #sendButton:hover, #micButton:hover, #muteButton:hover { border-color: #777; }
    #sendButton:active, #micButton:active, #muteButton:active { transform: scale(0.96); }
    #sendButton:disabled { cursor: not-allowed; opacity: 0.4; }
    #sendButton:not(:disabled) { border-color: rgba(100, 215, 164, 0.55); }
    #micButton.enabled {
        border-color: #34c759;
        box-shadow: 0 0 28px rgba(52, 199, 89, 0.22), inset 0 0 14px rgba(52, 199, 89, 0.06);
    }
    #micButton.enabled svg { stroke: #6fe08e; }
    #muteButton.muted svg { stroke: #ff9f8f; }

    #controlRow {
        width: min(720px, calc(100vw - 40px));
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    #timer {
        font-size: 13px;
        color: #fff;
        opacity: 0.4;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.08em;
        width: 54px;
        text-align: center;
        transition: opacity 0.4s;
    }
    @media (max-width: 640px) {
        #topBar { padding: 16px; }
        #conversation {
            width: calc(100vw - 24px);
            bottom: 178px;
            max-height: 48vh;
        }
        #composer, #controlRow { width: calc(100vw - 24px); }
        .message { max-width: 88%; font-size: 14px; }
        #toast { max-width: calc(100vw - 24px); white-space: normal; text-align: center; }
    }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="ui">
    <div id="topBar">
        <div id="modelLabel">峰哥 · MiMo</div>
        <div id="statusPill">
            <span id="statusDot" class="ready"></span>
            <span id="statusText">就绪</span>
        </div>
    </div>

    <div id="toast"></div>

    <div id="conversation" aria-live="polite" aria-label="对话记录">
        <div id="messageList"></div>
    </div>

    <div id="bottomControls">
        <div id="composer">
            <textarea id="messageInput" rows="1" maxlength="2000" placeholder="正在连接，可先输入消息"></textarea>
            <button id="sendButton" disabled aria-label="发送消息" title="发送消息">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 2 11 13"></path>
                    <path d="m22 2-7 20-4-9-9-4Z"></path>
                </svg>
            </button>
        </div>
        <div id="controlRow">
            <button id="micButton" aria-label="启用麦克风" title="启用或关闭麦克风">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="2.5" width="6" height="11.5" rx="3"></rect>
                    <path d="M5 11.5a7 7 0 0 0 14 0"></path>
                    <line x1="12" y1="18.5" x2="12" y2="21.5"></line>
                </svg>
            </button>
            <div id="timer">00:00</div>
            <button id="muteButton" aria-label="静音语音回复" title="静音或恢复语音回复">
                <svg class="soundOnIcon" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 5 6 9H2v6h4l5 4Z"></path>
                    <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                    <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
                </svg>
            </button>
        </div>
    </div>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>

<script src="livekit-client.umd.js"></script>
<!-- three.js r160+ 不再提供 UMD 版 three.min.js（404），改用 ES module 构建 -->
<script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.min.js';
    window.THREE = THREE;
    window.dispatchEvent(new Event('three-ready'));
</script>
<script>
function bootTalkToMe() {
    'use strict';
    const THREE = window.THREE;

    // ================================================================
    //  CONFIG
    // ================================================================
    const PARTICLE_MODE = 'abstract'; // 'abstract' | 'photo' — V3.6 暂回退到星空粒子效果
    const PARTICLE_COUNT = 5000;

    const MODEL_NAME = '峰哥';
    const MAX_VISIBLE_MESSAGES = 100;
    const TEXT_CHAT_TOPIC = 'talk-to-fengge.chat';

    // ================================================================
    //  DOM
    // ================================================================
    const canvas = document.getElementById('scene');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const toastEl = document.getElementById('toast');
    const micButton = document.getElementById('micButton');
    const muteButton = document.getElementById('muteButton');
    const sendButton = document.getElementById('sendButton');
    const messageInput = document.getElementById('messageInput');
    const conversationEl = document.getElementById('conversation');
    const messageList = document.getElementById('messageList');
    const timerEl = document.getElementById('timer');
    const remoteAudio = document.getElementById('remoteAudio');

    // ================================================================
    //  THREE.JS PARTICLE SYSTEM
    // ================================================================
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    const CAMERA_RADIUS = 95;
    camera.position.set(0, 6, CAMERA_RADIUS);
    camera.lookAt(0, 0, 0);

    // ---- Nebula-like organic distribution ------------------------------
    // Particles cluster along a few stretched gaussian "filaments" plus a
    // sparse halo — organic, not a sphere, not a grid.
    function gaussian() {
        let u = 0, v = 0;
        while (u === 0) u = Math.random();
        while (v === 0) v = Math.random();
        return Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
    }

    const CLUSTERS = [];
    const CLUSTER_COUNT = 6;
    for (let c = 0; c < CLUSTER_COUNT; c++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 8 + Math.random() * 22;
        // random stretch axis turns blobs into filaments
        const ax = Math.random() - 0.5, ay = Math.random() - 0.5, az = Math.random() - 0.5;
        const al = Math.hypot(ax, ay, az) || 1;
        CLUSTERS.push({
            x: r * Math.sin(phi) * Math.cos(theta),
            y: r * Math.sin(phi) * Math.sin(theta) * 0.65,
            z: r * Math.cos(phi),
            sigma: 5 + Math.random() * 9,
            stretch: 1.8 + Math.random() * 2.6,
            axis: [ax / al, ay / al, az / al],
        });
    }

    function sampleNebulaPoint(out) {
        if (Math.random() < 0.07) {
            // sparse halo
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 26 + Math.pow(Math.random(), 0.6) * 22;
            out[0] = r * Math.sin(phi) * Math.cos(theta);
            out[1] = r * Math.sin(phi) * Math.sin(theta) * 0.6;
            out[2] = r * Math.cos(phi);
            return;
        }
        const cl = CLUSTERS[(Math.random() * CLUSTER_COUNT) | 0];
        let dx = gaussian() * cl.sigma;
        let dy = gaussian() * cl.sigma;
        let dz = gaussian() * cl.sigma;
        // stretch along the cluster axis
        const dot = dx * cl.axis[0] + dy * cl.axis[1] + dz * cl.axis[2];
        dx += cl.axis[0] * dot * (cl.stretch - 1);
        dy += cl.axis[1] * dot * (cl.stretch - 1);
        dz += cl.axis[2] * dot * (cl.stretch - 1);
        out[0] = cl.x + dx;
        out[1] = cl.y + dy;
        out[2] = cl.z + dz;
    }

    // ---- BufferGeometry attributes -------------------------------------
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const colors = new Float32Array(PARTICLE_COUNT * 3);
    const sizes = new Float32Array(PARTICLE_COUNT);
    const velocities = new Float32Array(PARTICLE_COUNT * 3);
    const basePositions = new Float32Array(PARTICLE_COUNT * 3);
    // targetPosition: reserved for photo-dissolve mode (V3.6) — particles
    // morph between basePosition and targetPosition via u_morph.
    const targetPositions = new Float32Array(PARTICLE_COUNT * 3);

    const tmp = [0, 0, 0];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        sampleNebulaPoint(tmp);
        const i3 = i * 3;
        positions[i3] = basePositions[i3] = targetPositions[i3] = tmp[0];
        positions[i3 + 1] = basePositions[i3 + 1] = targetPositions[i3 + 1] = tmp[1];
        positions[i3 + 2] = basePositions[i3 + 2] = targetPositions[i3 + 2] = tmp[2];

        // cool white (#e8e8ff) with subtle per-particle variation
        const tint = 0.85 + Math.random() * 0.15;
        colors[i3] = 0.91 * tint;
        colors[i3 + 1] = 0.91 * tint;
        colors[i3 + 2] = 1.0 * tint;

        // a few brighter "stars" among fine dust
        sizes[i] = Math.random() < 0.05
            ? 3.6 + Math.random() * 2.2
            : 1.5 + Math.random() * 1.7;

        // random scatter direction for audio displacement
        const vt = Math.random() * Math.PI * 2;
        const vp = Math.acos(2 * Math.random() - 1);
        const vm = 0.4 + Math.random() * 0.6;
        velocities[i3] = vm * Math.sin(vp) * Math.cos(vt);
        velocities[i3 + 1] = vm * Math.sin(vp) * Math.sin(vt);
        velocities[i3 + 2] = vm * Math.cos(vp);
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    geometry.setAttribute('velocity', new THREE.BufferAttribute(velocities, 3));
    geometry.setAttribute('basePosition', new THREE.BufferAttribute(basePositions, 3));
    geometry.setAttribute('targetPosition', new THREE.BufferAttribute(targetPositions, 3));

    // ---- Shaders --------------------------------------------------------
    const uniforms = {
        u_time: { value: 0 },
        u_audioLevel: { value: 0 },
        u_bassLevel: { value: 0 },
        u_trebleLevel: { value: 0 },
        u_morph: { value: 0 }, // 0 = basePosition (abstract), 1 = targetPosition (photo)
        u_pixelRatio: { value: Math.min(window.devicePixelRatio, 2) },
    };

    const vertexShader = `
        // Ashima 3D simplex noise
        vec3 mod289(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
        vec4 mod289(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
        vec4 permute(vec4 x){ return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v){
            const vec2 C = vec2(1.0/6.0, 1.0/3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute(permute(permute(
                      i.z + vec4(0.0, i1.z, i2.z, 1.0))
                    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                    + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 0.142857142857;
            vec3 ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ * ns.x + ns.yyyy;
            vec4 y = y_ * ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
            vec3 p0 = vec3(a0.xy, h.x);
            vec3 p1 = vec3(a0.zw, h.y);
            vec3 p2 = vec3(a1.xy, h.z);
            vec3 p3 = vec3(a1.zw, h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
        }

        attribute float size;
        attribute vec3 velocity;
        attribute vec3 basePosition;
        attribute vec3 targetPosition;

        uniform float u_time;
        uniform float u_audioLevel;
        uniform float u_bassLevel;
        uniform float u_trebleLevel;
        uniform float u_morph;
        uniform float u_pixelRatio;

        varying vec3 vColor;
        varying float vAlpha;

        void main() {
            // photo mode (V3.6): morph rest position toward image targets
            vec3 rest = mix(basePosition, targetPosition, u_morph);

            // continuous noise-driven drift (calm breathing of the nebula)
            float t = u_time * 0.13;
            vec3 np = rest * 0.018;
            vec3 drift = vec3(
                snoise(np + vec3(t, 0.0, 0.0)),
                snoise(np + vec3(0.0, t, 7.31)),
                snoise(np + vec3(11.7, 3.1, t))
            );
            vec3 pos = rest + drift * (2.2 + u_bassLevel * 9.0);

            // bass: slow large-scale wave rolling through the field
            float wave = snoise(rest * 0.03 + vec3(0.0, 0.0, u_time * 0.45));
            pos += normalize(rest + vec3(0.001)) * wave * u_bassLevel * 7.0;

            // overall audio displacement: expand outward from rest position
            pos += normalize(rest + vec3(0.001)) * u_audioLevel * u_audioLevel * 13.0;
            pos += velocity * u_audioLevel * 7.0;

            vec4 mv = modelViewMatrix * vec4(pos, 1.0);

            // treble: per-particle shimmer / sparkle on size
            float phase = rest.x * 0.7 + rest.y * 1.3 + rest.z * 0.4;
            float shimmer = 1.0 + u_trebleLevel * 1.6 * (0.5 + 0.5 * sin(u_time * 9.0 + phase));
            gl_PointSize = size * shimmer * (1.0 + u_audioLevel * 0.35)
                         * u_pixelRatio * (140.0 / -mv.z);

            // cool white at rest -> warm gold (#ffd699) when audio is active
            vColor = mix(color, vec3(1.0, 0.84, 0.6), clamp(u_audioLevel * 1.4, 0.0, 0.92));
            vAlpha = 0.8 + 0.2 * u_audioLevel;

            gl_Position = projectionMatrix * mv;
        }
    `;

    const fragmentShader = `
        varying vec3 vColor;
        varying float vAlpha;

        void main() {
            // soft circular point with glow falloff — no hard squares
            vec2 uv = gl_PointCoord - vec2(0.5);
            float d = length(uv);
            if (d > 0.5) discard;
            float core = exp(-d * d * 14.0);
            float halo = smoothstep(0.5, 0.0, d) * 0.45;
            float a = (core + halo) * vAlpha;
            gl_FragColor = vec4(vColor * a, a);
        }
    `;

    const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader,
        fragmentShader,
        vertexColors: true,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);
    // debug handle: inspect/override audio uniforms from console while tuning
    window.__ttm = { uniforms, levels: null };

    // ================================================================
    //  MODE 2: PHOTO-DISSOLVE  (V3.6 — architecture only, NOT active)
    // ================================================================
    // TODO(V3.6): implement image sampling.
    //   1. Load image into an offscreen <canvas>, getImageData().
    //   2. Sample PARTICLE_COUNT bright pixels; map (x, y) -> world plane
    //      coords, brightness -> slight z-depth; write into the
    //      'targetPosition' attribute and pixel RGB into 'color'.
    //   3. Animate uniforms.u_morph 1 -> assemble portrait,
    //      0 -> dissolve back into the abstract nebula.
    // All attributes (position/color/size/velocity/basePosition/
    // targetPosition) and the u_morph uniform already exist, so this is
    // purely image-sampling + a tween.
    async function loadPhotoTargets(imageUrl) {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = () => reject(new Error('portrait load failed: ' + imageUrl));
            img.src = imageUrl;
        });

        const cw = 200, ch = Math.round(200 * (img.height / img.width));
        const offscreen = document.createElement('canvas');
        offscreen.width = cw;
        offscreen.height = ch;
        const ctx2d = offscreen.getContext('2d');
        ctx2d.drawImage(img, 0, 0, cw, ch);
        const imageData = ctx2d.getImageData(0, 0, cw, ch);
        const pixels = imageData.data;

        // collect bright-enough pixels
        const candidates = [];
        for (let y = 0; y < ch; y++) {
            for (let x = 0; x < cw; x++) {
                const idx = (y * cw + x) * 4;
                const r = pixels[idx], g = pixels[idx+1], b = pixels[idx+2];
                const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                if (brightness > 30) {
                    candidates.push({ x, y, r, g, b, brightness });
                }
            }
        }

        // map pixel coords to world space centered at origin
        const SPREAD = 40;
        const aspectRatio = cw / ch;
        const halfW = SPREAD * 0.5 * aspectRatio;
        const halfH = SPREAD * 0.5;

        const tPos = geometry.attributes.targetPosition.array;
        const cols = geometry.attributes.color.array;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const i3 = i * 3;
            if (candidates.length === 0) break;
            const px = candidates[Math.floor(Math.random() * candidates.length)];

            // map (x,y) to world plane, slight z depth from brightness
            tPos[i3]     = (px.x / cw - 0.5) * 2 * halfW;
            tPos[i3 + 1] = -(px.y / ch - 0.5) * 2 * halfH;
            tPos[i3 + 2] = (px.brightness / 255 - 0.5) * 4;

            // set particle color from image pixel
            cols[i3]     = px.r / 255;
            cols[i3 + 1] = px.g / 255;
            cols[i3 + 2] = px.b / 255;
        }

        geometry.attributes.targetPosition.needsUpdate = true;
        geometry.attributes.color.needsUpdate = true;

        // animate morph 0 -> 1 over 2 seconds
        const morphStart = performance.now();
        const MORPH_DURATION = 2000;
        function animateMorph() {
            const t = Math.min((performance.now() - morphStart) / MORPH_DURATION, 1);
            const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            uniforms.u_morph.value = eased;
            if (t < 1) requestAnimationFrame(animateMorph);
        }
        animateMorph();
        console.log('photo targets loaded:', candidates.length, 'pixels sampled');
    }

    if (PARTICLE_MODE === 'photo') {
        loadPhotoTargets('portrait.jpg').catch(e => {
            console.warn('photo mode fallback to abstract:', e.message);
        });
    }

    // ================================================================
    //  AUDIO ANALYSIS (Web Audio API)
    // ================================================================
    let audioContext = null;
    let analyser = null;
    let freqData = null;
    let remoteSourceNode = null;   // createMediaElementSource — once per element
    let remoteGainNode = null;
    let micSourceNode = null;

    // smoothed levels (never feed raw FFT to the shader)
    const levels = { audio: 0, bass: 0, treble: 0 };
    const targets = { audio: 0, bass: 0, treble: 0 };
    if (window.__ttm) window.__ttm.levels = levels;

    function ensureAudioGraph() {
        if (audioContext) {
            if (audioContext.state === 'suspended') audioContext.resume();
            if (remoteAudio.play) remoteAudio.play().catch(() => {});
            return;
        }
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.55;
        freqData = new Uint8Array(analyser.frequencyBinCount);

        // remote AI voice (primary, gain 1.0) — element output is rerouted
        // through the graph, so also connect to destination to stay audible
        remoteGainNode = audioContext.createGain();
        remoteGainNode.gain.value = remoteMuted ? 0 : 1;
        try {
            remoteSourceNode = audioContext.createMediaElementSource(remoteAudio);
            remoteSourceNode.connect(remoteGainNode);
            remoteGainNode.connect(analyser);
            remoteGainNode.connect(audioContext.destination);
        } catch (err) {
            console.warn('remote audio analyser hookup failed', err);
        }
        audioContext._micGain = audioContext.createGain();
        audioContext._micGain.gain.value = 0.3; // local mic, secondary
        audioContext._micGain.connect(analyser); // NOT to destination (no feedback)
        if (remoteAudio.play) remoteAudio.play().catch(() => {});
    }

    function connectMicToAnalyser(mediaStreamTrack) {
        if (!audioContext || !mediaStreamTrack) return;
        try {
            const stream = new MediaStream([mediaStreamTrack]);
            micSourceNode = audioContext.createMediaStreamSource(stream);
            micSourceNode.connect(audioContext._micGain);
        } catch (err) {
            console.warn('mic analyser hookup failed', err);
        }
    }

    function disconnectMicFromAnalyser() {
        if (micSourceNode) {
            try { micSourceNode.disconnect(); } catch (_) {}
            micSourceNode = null;
        }
    }

    function sampleAudio() {
        if (!analyser || !connected) {
            targets.audio = 0; targets.bass = 0; targets.treble = 0;
            return;
        }
        analyser.getByteFrequencyData(freqData);
        let sum = 0;
        for (let i = 0; i < freqData.length; i++) sum += freqData[i];
        targets.audio = sum / freqData.length / 255;

        let bass = 0;
        for (let i = 0; i <= 3; i++) bass += freqData[i];
        targets.bass = bass / 4 / 255;

        let treble = 0;
        for (let i = 20; i <= 40; i++) treble += freqData[i];
        targets.treble = treble / 21 / 255;
    }

    function smoothLevels(dt) {
        // fast attack, slow release — feels alive, never mechanical
        for (const k of ['audio', 'bass', 'treble']) {
            const t = targets[k];
            const rate = t > levels[k] ? 10.0 : 2.8;
            levels[k] += (t - levels[k]) * Math.min(1, rate * dt);
        }
    }

    // ================================================================
    //  RENDER LOOP
    // ================================================================
    const clock = new THREE.Clock();
    let orbitAngle = 0;

    function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.elapsedTime;

        sampleAudio();
        smoothLevels(dt);

        uniforms.u_time.value = elapsed;
        uniforms.u_audioLevel.value = levels.audio;
        uniforms.u_bassLevel.value = levels.bass;
        uniforms.u_trebleLevel.value = levels.treble;

        // slight auto-orbit, 0.05 rad/s around Y
        orbitAngle += 0.05 * dt;
        camera.position.x = Math.sin(orbitAngle) * CAMERA_RADIUS;
        camera.position.z = Math.cos(orbitAngle) * CAMERA_RADIUS;
        camera.position.y = 6 + Math.sin(elapsed * 0.07) * 3;
        camera.lookAt(0, 0, 0);

        // subtle slow rotation of the formation itself
        points.rotation.y += 0.008 * dt;

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.u_pixelRatio.value = Math.min(window.devicePixelRatio, 2);
    });

    // ================================================================
    //  UI STATE
    // ================================================================
    let toastTimeout = null;
    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 3000);
    }

    // states: ready | connecting | connected | disconnected | error
    function setStatus(state, customText) {
        if (state === 'ready') {
            statusDot.className = 'ready';
            statusText.textContent = MODEL_NAME + ' 就绪';
        } else if (state === 'connecting') {
            statusDot.className = 'connecting';
            statusText.textContent = MODEL_NAME + ' 连接中...';
        } else if (state === 'connected') {
            statusDot.className = 'connected';
            statusText.textContent = MODEL_NAME + ' 对话中';
        } else if (state === 'disconnected') {
            statusDot.className = 'ready';
            statusText.textContent = MODEL_NAME + ' 已断开';
        } else {
            statusDot.className = 'error';
            statusText.textContent = customText || '出错了';
        }
    }

    // ---- timer ----
    let timerInterval = null;
    let connectStart = 0;
    function startTimer() {
        connectStart = Date.now();
        timerEl.textContent = '00:00';
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            const s = Math.floor((Date.now() - connectStart) / 1000);
            const mm = String(Math.floor(s / 60)).padStart(2, '0');
            const ss = String(s % 60).padStart(2, '0');
            timerEl.textContent = mm + ':' + ss;
        }, 500);
    }
    function stopTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
    }

    // ---- 对话消息列表 ----
    const messageElements = new Map();

    /** 限制页面保留的消息节点数量，避免长会话持续占用内存。 */
    function trimMessages() {
        while (messageList.children.length > MAX_VISIBLE_MESSAGES) {
            const oldest = messageList.firstElementChild;
            if (!oldest) break;
            for (const [key, value] of messageElements.entries()) {
                if (value === oldest) messageElements.delete(key);
            }
            oldest.remove();
        }
    }

    /** 新增消息或按分段标识更新已有的增量消息。 */
    function upsertMessage(role, text, segmentId) {
        const content = String(text || '').trim();
        if (!content) return;
        const key = segmentId || role + '-' + Date.now() + '-' + Math.random();
        let element = messageElements.get(key);
        if (!element) {
            element = document.createElement('div');
            element.className = 'message ' + role;
            element.dataset.segmentId = key;
            messageElements.set(key, element);
            messageList.appendChild(element);
        }
        element.textContent = content;
        trimMessages();
        conversationEl.scrollTop = conversationEl.scrollHeight;
    }

    /** 将 LiveKit DataPacket 解码为结构化消息。 */
    function parseDataMessage(payload) {
        let text = '';
        try { text = new TextDecoder().decode(payload); } catch (_) { return null; }
        try { return JSON.parse(text); } catch (_) { return { message: text }; }
    }

    /** 展示 Agent 主动发送的状态或兼容数据消息。 */
    function handleDataMessage(payload) {
        const data = parseDataMessage(payload);
        if (!data) return;
        const message = typeof data === 'string'
            ? data
            : data.message || data.text || data.transcript || data.transcription || '';
        if (!message) return;
        if (data.code === 'tts_unavailable') {
            upsertMessage('system', message, 'tts-unavailable-' + Date.now());
            showToast(message);
            return;
        }
        upsertMessage('assistant', message);
    }

    // ---- 远端语音静音 ----
    let remoteMuted = localStorage.getItem('ttm-remote-muted') === 'true';
    /** 将持久化的静音状态同步到媒体元素、增益节点和按钮。 */
    function applyRemoteMute() {
        remoteAudio.muted = remoteMuted;
        if (remoteGainNode) remoteGainNode.gain.value = remoteMuted ? 0 : 1;
        muteButton.classList.toggle('muted', remoteMuted);
        muteButton.setAttribute('aria-label', remoteMuted ? '恢复语音回复' : '静音语音回复');
        muteButton.title = remoteMuted ? '恢复语音回复' : '静音语音回复';
    }

    muteButton.addEventListener('click', () => {
        remoteMuted = !remoteMuted;
        localStorage.setItem('ttm-remote-muted', String(remoteMuted));
        applyRemoteMute();
    });

    // ================================================================
    //  LIVEKIT 连接
    // ================================================================
    const TOKEN_URL = window.location.origin + '/token';

    /** 从同源 Web 服务获取房间凭证和浏览器可访问的 LiveKit 地址。 */
    async function getConnectionInfo() {
        const identity = 'user-' + Math.random().toString(36).substring(2, 8);
        const resp = await fetch(TOKEN_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ room: 'ttm-mimo-room', identity: identity, name: '粉丝' }),
        });
        if (!resp.ok) {
            const text = await resp.text();
            throw new Error('Token 获取失败 (HTTP ' + resp.status + '): ' + text);
        }
        const data = await resp.json();
        if (!data.token) throw new Error('Token 为空');
        if (!data.livekit_url) throw new Error('LiveKit 公网地址为空');
        return data;
    }

    let room = null;
    let connected = false;
    let connecting = false;
    let localIdentity = '';
    let microphoneEnabled = false;
    let agentReady = false;

    /** 更新输入提示；即使房间暂未连接，也允许用户先填写文字。 */
    function setComposerEnabled(enabled) {
        messageInput.disabled = false;
        sendButton.disabled = !messageInput.value.trim();
        messageInput.placeholder = enabled
            ? '输入消息，Enter 发送'
            : '正在连接，可先输入消息';
    }

    /** 注册 AI 与用户语音转写的原生 LiveKit 文本流处理器。 */
    function registerTextHandlers(activeRoom) {
        activeRoom.registerTextStreamHandler('lk.transcription', async (reader, participantInfo) => {
            try {
                const text = await reader.readAll();
                const attributes = reader.info && reader.info.attributes
                    ? reader.info.attributes
                    : {};
                const segmentId = attributes['lk.segment_id']
                    || (reader.info && reader.info.id)
                    || 'segment-' + Date.now() + '-' + Math.random();
                const identity = participantInfo && participantInfo.identity
                    ? participantInfo.identity
                    : String(participantInfo || '');
                const role = identity === localIdentity ? 'user' : 'assistant';
                upsertMessage(role, text, segmentId);
            } catch (error) {
                console.warn('transcription stream error', error);
            }
        });
    }

    /** 生成不依赖安全上下文 crypto.randomUUID 的消息标识。 */
    function createMessageId() {
        return 'msg-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    }

    /** 通过可靠 DataPacket 将用户文字发送到当前 AgentSession。 */
    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;
        if (!connected || !room) {
            if (!connecting) connect();
            showToast('正在连接，请稍后再次发送');
            return;
        }
        if (!agentReady) {
            showToast('峰哥正在进入房间，请稍后再次发送');
            return;
        }

        // 用户点击发送属于浏览器手势，可在此恢复远端音频播放上下文。
        ensureAudioGraph();
        const messageId = createMessageId();
        const payload = new TextEncoder().encode(JSON.stringify({
            type: 'user_message',
            id: messageId,
            text: text,
        }));
        messageInput.value = '';
        messageInput.style.height = 'auto';
        sendButton.disabled = true;
        try {
            await room.localParticipant.publishData(payload, {
                reliable: true,
                topic: TEXT_CHAT_TOPIC,
            });
            upsertMessage('user', text, messageId);
        } catch (error) {
            console.error('publish text data failed', error);
            messageInput.value = text;
            sendButton.disabled = false;
            const reason = error && error.message ? error.message : '未知错误';
            showToast('消息发送失败：' + reason);
        }
    }

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('input', () => {
        sendButton.disabled = !messageInput.value.trim();
        messageInput.style.height = 'auto';
        messageInput.style.height = Math.min(messageInput.scrollHeight, 112) + 'px';
    });
    messageInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    });

    async function connect() {
        if (connected || connecting) return connected;
        connecting = true;
        setStatus('connecting');

        try {
            const connectionInfo = await getConnectionInfo();

            room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });
            registerTextHandlers(room);

            room.on(LivekitClient.RoomEvent.Connected, () => {
                connected = true;
                localIdentity = room.localParticipant ? room.localParticipant.identity : '';
                agentReady = room.remoteParticipants && room.remoteParticipants.size > 0;
                setStatus('connected');
                setComposerEnabled(true);
                startTimer();
            });

            room.on(LivekitClient.RoomEvent.Disconnected, () => {
                connected = false;
                connecting = false;
                agentReady = false;
                setStatus('disconnected');
                microphoneEnabled = false;
                micButton.classList.remove('enabled');
                micButton.setAttribute('aria-label', '启用麦克风');
                setComposerEnabled(false);
                stopTimer();
                disconnectMicFromAnalyser();
                remoteAudio.srcObject = null;
                room = null;
            });

            room.on(LivekitClient.RoomEvent.ParticipantConnected, () => {
                agentReady = true;
                setStatus('connected');
            });

            room.on(LivekitClient.RoomEvent.ParticipantDisconnected, () => {
                agentReady = room.remoteParticipants && room.remoteParticipants.size > 0;
            });

            room.on(LivekitClient.RoomEvent.TrackSubscribed, (track) => {
                if (track.kind !== LivekitClient.Track.Kind.Audio) return;
                track.attach(remoteAudio);
                applyRemoteMute();
                const p = remoteAudio.play ? remoteAudio.play() : null;
                if (p && typeof p.catch === 'function') {
                    p.catch((err) => console.warn('remote audio autoplay blocked', err));
                }
            });

            room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (track) => {
                if (track.kind !== LivekitClient.Track.Kind.Audio) return;
                try { track.detach(remoteAudio); } catch (_) {}
                remoteAudio.srcObject = null;
            });

            room.on(LivekitClient.RoomEvent.DataReceived, (payload) => {
                handleDataMessage(payload);
            });

            await room.connect(connectionInfo.livekit_url, connectionInfo.token);
            connecting = false;
            return true;
        } catch (err) {
            console.error(err);
            connecting = false;
            connected = false;
            setStatus('error', '连接失败');
            micButton.classList.remove('enabled');
            setComposerEnabled(false);
            if (room) { try { room.disconnect(); } catch (_) {} room = null; }
            return false;
        }
    }

    /** 只切换麦克风输入，不再承担房间连接和断开职责。 */
    async function toggleMicrophone() {
        if (!connected) {
            const connectedNow = await connect();
            if (!connectedNow) {
                showToast('房间尚未连接，无法启用麦克风');
                return;
            }
        }

        ensureAudioGraph();
        const nextEnabled = !microphoneEnabled;
        try {
            await room.localParticipant.setMicrophoneEnabled(nextEnabled);
            microphoneEnabled = nextEnabled;
            micButton.classList.toggle('enabled', microphoneEnabled);
            micButton.setAttribute(
                'aria-label',
                microphoneEnabled ? '关闭麦克风' : '启用麦克风'
            );
            micButton.title = microphoneEnabled ? '关闭麦克风' : '启用麦克风';

            if (!microphoneEnabled) {
                disconnectMicFromAnalyser();
                return;
            }
            const publications = room.localParticipant.audioTrackPublications;
            const publication = publications && publications.size
                ? publications.values().next().value
                : null;
            if (publication && publication.track && publication.track.mediaStreamTrack) {
                connectMicToAnalyser(publication.track.mediaStreamTrack);
            }
        } catch (error) {
            console.warn('microphone error', error);
            microphoneEnabled = false;
            micButton.classList.remove('enabled');
            const message = window.isSecureContext
                ? '麦克风启用失败，请检查浏览器权限'
                : '当前是非安全 HTTP 页面，浏览器禁止麦克风；文字对话仍可使用';
            showToast(message);
        }
    }

    micButton.addEventListener('click', toggleMicrophone);

    applyRemoteMute();
    setComposerEnabled(false);
    setStatus('ready');
    connect();
}

if (window.THREE) bootTalkToMe();
else window.addEventListener('three-ready', bootTalkToMe, { once: true });
</script>
</body>
</html>
